<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6b35">
<title>Checklist Diário</title>
<style>
:root{
  --verde:#0a7a3c; --verde-esc:#06542a; --verde-cl:#e8f4ec; --verde-br:#1fa35a;
  --vermelho:#d71920; --tinta:#1b2620; --suave:#5d6b63; --linha:#d9e5dd; --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);background:#f2f7f3;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* ---------- fundo animado ---------- */
.fundo{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#f6faf7 0%,#e6f2ea 100%)}
.bolha{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:flutua 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#1fa35a;top:-90px;left:-110px}
.b2{width:280px;height:280px;background:#0a7a3c;bottom:8%;right:-120px;animation-duration:22s}
.b3{width:200px;height:200px;background:#7cc99a;top:45%;left:-80px;animation-duration:26s}
.b4{width:120px;height:120px;background:#d71920;opacity:.12;top:18%;right:10%;animation-duration:20s}
@keyframes flutua{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,60px) scale(1.12)}100%{transform:translate(-30px,20px) scale(.95)}}
.fundo::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(10,122,60,.09) 1px,transparent 1px);background-size:22px 22px}

/* ---------- topo ---------- */
.topo{background:linear-gradient(135deg,var(--verde) 0%,var(--verde-esc) 100%);color:#fff;padding:18px 16px 56px;position:relative;overflow:hidden}
.topo::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);top:-120px;right:-60px}
.topo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-100%);animation:brilho 6s ease-in-out infinite}
@keyframes brilho{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.logo-box{background:#fff;border-radius:14px;padding:10px 14px;display:inline-flex;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:1}
.logo-box img{height:38px;width:auto;display:block}
.topo h1{font-size:28px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;margin-top:18px;position:relative;z-index:1}
.topo .centro{text-align:center}
.titulo-linha{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.titulo-linha h1{margin-top:0}
@media (max-width:699px){.titulo-linha h1{order:3;flex-basis:100%}.titulo-linha{gap:10px}.titulo-linha .logo-box{height:46px}.titulo-linha .logo-box img{height:30px}.logo-box.jangaz img{height:26px}}
.titulo-linha .logo-box{padding:6px 12px;height:50px;align-items:center}
.titulo-linha .logo-box img{height:34px}
.logo-box.jangaz img{height:30px}
@media (min-width:700px){.titulo-linha{margin-top:0;gap:22px}.titulo-linha .logo-box{height:58px}.titulo-linha .logo-box img{height:40px}.logo-box.jangaz img{height:36px}}
@media (min-width:700px){.topo h1{font-size:40px;margin-top:0}}
.topo p{opacity:.85;font-size:14px;margin-top:4px;position:relative;z-index:1}
.data{display:inline-block;margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;position:relative;z-index:1}

main{max-width:1400px;margin:-36px auto 0;padding:0 16px 120px;position:relative}
#topicos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:stretch}
@media (min-width:700px){#topicos .capa{min-height:92px}}
#topicos .card{margin-bottom:0}
.dados .linha{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:700px){.dados .linha{grid-template-columns:2fr 1fr}main{margin-top:-44px;padding:0 24px 120px}.topo{padding:22px 24px 64px}.topo .wrap{max-width:1352px;margin:0 auto}}
.topo .wrap{position:relative;z-index:1}

/* ---------- cartões ---------- */
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 20px rgba(6,84,42,.08);border:1px solid var(--linha);margin-bottom:14px;overflow:hidden;
  opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease,box-shadow .3s,border-color .3s}
.card.visivel{opacity:1;transform:none}
.card.ok{border-color:var(--verde-br);box-shadow:0 6px 24px rgba(31,163,90,.18)}
.dados{padding:16px}
.dados h2{font-size:15px;color:var(--verde-esc);margin-bottom:12px;display:flex;align-items:center;gap:8px}
label.campo{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:10px 0 5px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;color:var(--tinta);background:#fbfdfc;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 4px rgba(10,122,60,.12)}
#placa,#carreta{text-transform:uppercase;letter-spacing:1px}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%2306542a%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
input:disabled{opacity:.55}
textarea{min-height:64px;resize:vertical}

/* capa do tópico */
.capa{position:relative;background:linear-gradient(120deg,var(--verde) 0%,var(--verde-br) 100%);color:#fff;padding:14px 16px 14px 60px;min-height:62px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.capa::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);transition:transform .6s}
.card:active .capa::after,.card:hover .capa::after{transform:scale(1.4)}
.capa .num{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:15px;transition:background .3s}
.card.ok .capa .num{background:#fff;color:var(--verde)}
.capa h3{font-size:17px;font-weight:700;line-height:1.2}
.capa small{font-size:12.5px;opacity:.88;margin-top:3px;line-height:1.3}
.corpo{padding:14px 16px 16px}

/* botão de foto */
.foto-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:2px dashed #9fcdb0;border-radius:14px;background:var(--verde-cl);color:var(--verde-esc);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.foto-btn:active{transform:scale(.97)}
.foto-acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foto-btn{position:relative;overflow:hidden}
.arquivo-foto{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.foto-btn svg{width:22px;height:22px}
.card.ok .foto-btn{border-style:solid;border-color:var(--verde-br);background:#fff}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);animation:entra .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes entra{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.mini img{width:100%;height:100%;object-fit:cover}
.mini button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:24px;cursor:pointer}
.processando{font-size:13px;color:var(--suave);margin-top:8px;display:none}
.dica{font-size:12px;color:var(--suave);margin-top:6px}

/* barra fixa inferior */
.rodape{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.rodape .in{max-width:1352px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1}
.prog span{font-size:12px;color:var(--suave);font-weight:600}
.trilho{height:8px;border-radius:99px;background:#e3ece6;margin-top:5px;overflow:hidden}
.trilho i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--verde-br));border-radius:99px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
.enviar{border:0;background:linear-gradient(135deg,var(--verde) 0%,var(--verde-esc) 100%);color:#fff;font-weight:800;font-size:16px;padding:14px 22px;border-radius:14px;box-shadow:0 6px 16px rgba(10,122,60,.35);cursor:pointer;transition:transform .15s,opacity .2s}
.enviar:active{transform:scale(.96)}
.enviar:disabled{opacity:.6}

/* mensagens */
.aviso{position:fixed;left:50%;top:16px;transform:translate(-50%,-120px);background:var(--vermelho);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20;transition:transform .35s cubic-bezier(.3,1.3,.5,1);max-width:92vw;text-align:center}
.aviso.on{transform:translate(-50%,0)}
.sucesso{display:none;max-width:560px;margin:0 auto 14px;text-align:center;padding:40px 22px}
.sucesso .check{width:84px;height:84px;border-radius:50%;background:var(--verde-br);margin:0 auto 18px;display:grid;place-items:center;animation:entra .5s cubic-bezier(.2,1.4,.4,1)}
.sucesso h2{color:var(--verde-esc);font-size:22px}
.sucesso p{color:var(--suave);margin-top:8px}
.carregando{position:fixed;inset:0;background:rgba(6,84,42,.75);display:none;place-items:center;z-index:30;color:#fff;text-align:center;font-weight:700}
.roda{width:46px;height:46px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

  ["Equipamentos de Rastreador", "Teclado / trava de baú"]
];
// numeração antiga (o antigo item 1 foi removido)
const NUM = ["1","2","3","4","5","6","7"];
// formato das placas
const PADRAO = {
  Tradicional:{re:/^[A-Z]{3}[0-9]{4}$/, ex:"ABC1234", msg:"Placa tradicional: 3 letras e 4 números (ex.: ABC1234)."},
  Mercosul:{re:/^[A-Z]{3}[0-9][A-Z][0-9]{2}$/, ex:"ABC1D23", msg:"Placa Mercosul: 3 letras, 1 número, 1 letra e 2 números (ex.: ABC1D23)."}
};
const MAX_FOTOS = 3, LADO = 1280, QUALIDADE = 0.72;
const fotos = TOPICOS.map(() => []);   // arquivos já comprimidos por tópico

const $ = s => document.querySelector(s);
const slug = t => t.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");

// data
const agora = new Date();

// montar tópicos
const galSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const camSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
$("#topicos").innerHTML = TOPICOS.map(([t,d],i)=>`
  <section class="card" id="t${i}">
    <div class="capa"><span class="num">${NUM[i]}</span><h3>${t}</h3>${d?`<small>${d}</small>`:""}</div>
    <div class="corpo">
      <div class="foto-acoes">
        <label class="foto-btn">${camSVG}<span>Câmera</span>
          <input type="file" accept="image/*" capture="environment" class="arquivo-foto" data-i="${i}">
        </label>
        <label class="foto-btn">${galSVG}<span>Galeria</span>
          <input type="file" accept="image/*" multiple class="arquivo-foto" data-i="${i}">
        </label>
      </div>
      <div class="processando">Preparando foto…</div>
      <div class="fotos"></div>
      <div class="arquivos" hidden></div>
      <label class="campo" for="c${i}">Comentário</label>
      <textarea id="c${i}" name="${NUM[i]}. ${t} - Comentário" placeholder="Observações (opcional)"></textarea>
    </div>
  </section>`).join("");

// placa: tipo escolhido define o formato aceito (veículo e carreta)
[["#tipoPlaca","#placa"],["#tipoCarreta","#carreta"]].forEach(([sel,inp])=>{
  $(sel).addEventListener("change",e=>{
    const p=$(inp), tipo=e.target.value;
    p.disabled=!tipo; p.value=""; p.placeholder=tipo?PADRAO[tipo].ex:"Escolha o tipo de placa";
    if(tipo) p.focus();
  });
  $(inp).addEventListener("input",e=>{
    const tipo=$(sel).value; let v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    let out="";
    for(const ch of v){
      const pos=out.length; if(pos>=7) break;
      const letra=/[A-Z]/.test(ch);
      const querLetra = pos<3 || (tipo==="Mercosul" && pos===4);
      if(querLetra===letra) out+=ch;
    }
    e.target.value=out;
  });
});
// animação de entrada ao rolar
const obs = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visivel");obs.unobserve(e.target)}}),{threshold:.08});
document.querySelectorAll(".card").forEach(c=>obs.observe(c));

// compressão da foto no celular
function comprimir(file){
  return new Promise((ok,erro)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      let w=img.naturalWidth,h=img.naturalHeight,esc=Math.min(1,LADO/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.round(w*esc);c.height=Math.round(h*esc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):erro(),"image/jpeg",QUALIDADE);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);erro()};
    img.src=url;
  });
}

function desenhar(i){
  const card=$("#t"+i), lista=card.querySelector(".fotos");
  lista.innerHTML="";
  fotos[i].forEach((f,k)=>{
    const d=document.createElement("div");d.className="mini";
    d.innerHTML=`<img src="${URL.createObjectURL(f)}" alt=""><button type="button" aria-label="Remover">×</button>`;
    d.querySelector("button").onclick=()=>{fotos[i].splice(k,1);desenhar(i)};
    lista.appendChild(d);
  });
  card.classList.toggle("ok",fotos[i].length>0);

  progresso();
}

// toque no botão abre a câmera/galeria (forma mais compatível com iPhone e Android)
document.addEventListener("click",e=>{
  const btn=e.target.closest(".foto-btn"); if(!btn||e.target.matches("input")) return;
  e.preventDefault(); btn.querySelector("input").click();
});
document.addEventListener("change",async e=>{
  const inp=e.target; if(!inp.matches("input[type=file][data-i]")) return;
  const i=+inp.dataset.i, card=$("#t"+i), proc=card.querySelector(".processando");
  const novos=[...inp.files].slice(0,MAX_FOTOS-fotos[i].length);
  if(!novos.length){ if(inp.files.length) avisar("Máximo de "+MAX_FOTOS+" fotos por item."); inp.value=""; return; }
  proc.style.display="block";
  for(const f of novos){
    try{
      const b=await comprimir(f);
      const nome=`${NUM[i].replace(".","-").padStart(2,"0")}_${slug(TOPICOS[i][0])}_${fotos[i].length+1}.jpg`;
      fotos[i].push(new File([b],nome,{type:"image/jpeg"}));
    }catch(_){avisar("Não foi possível ler uma das fotos.")}
  }
  proc.style.display="none"; inp.value=""; desenhar(i);
});

function progresso(){
  const n=fotos.filter(f=>f.length).length;
  $("#progTxt").textContent=`${n} de ${TOPICOS.length} itens com foto`;
  $("#progBar").style.width=(n/TOPICOS.length*100)+"%";
}

let tAviso;
function avisar(msg){const a=$("#aviso");a.textContent=msg;a.classList.add("on");clearTimeout(tAviso);tAviso=setTimeout(()=>a.classList.remove("on"),3200)}

$("#btnEnviar").onclick=()=>{
  const mot=$("#motorista").value.trim(), placa=$("#placa").value.trim().toUpperCase();
  if(!mot){avisar("Informe o nome do motorista.");$("#motorista").focus();return}
  const tipo=$("#tipoPlaca").value;
  if(!tipo){avisar("Escolha o tipo de placa: tradicional ou Mercosul.");$("#tipoPlaca").focus();return}
  if(!placa){avisar("Informe a placa do veículo.");$("#placa").focus();return}
  if(!PADRAO[tipo].re.test(placa)){avisar(PADRAO[tipo].msg);$("#placa").focus();return}
  const tipoC=$("#tipoCarreta").value, placaC=$("#carreta").value.trim().toUpperCase();
  if(tipoC && placaC && !PADRAO[tipoC].re.test(placaC)){avisar("Carreta - "+PADRAO[tipoC].msg);$("#carreta").focus();return}
  if(tipoC && !placaC){avisar("Informe a placa da carreta ou deixe o tipo em branco.");$("#carreta").focus();return}
  // basta um tópico preenchido (foto ou comentário); só os preenchidos vão no e-mail
  const preenchido=i=>fotos[i].length>0||$("#c"+i).value.trim()!=="";
  const usados=TOPICOS.map((_,i)=>i).filter(preenchido);
  if(!usados.length){avisar("Preencha pelo menos um item (foto ou comentário).");$("#t0").scrollIntoView({behavior:"smooth",block:"center"});return}
  TOPICOS.forEach((_,i)=>{$("#c"+i).disabled=!preenchido(i)});
  $("#itensEnviados").value=usados.map(i=>NUM[i]+". "+TOPICOS[i][0]).join(" | ");

  $("#placa").value=placa;
  const carreta=$("#carreta").value.trim().toUpperCase(); $("#carreta").value=carreta;
  const dh=new Date().toLocaleString("pt-BR");
  $("#datahora").value=dh;
  $("#assunto").value=`Checklist Diário - ${placa}${carreta?" / "+carreta:""} - ${mot} - ${dh}`;
  $("#proximo").value=location.href.split("?")[0]+"?enviado=1";
  // monta o envio com as fotos comprimidas anexadas diretamente (FormSubmit)
  const fd=new FormData($("#form"));
  fotos.forEach((lista,i)=>lista.forEach((f,k)=>fd.append(`Foto_${NUM[i].replace(".","-").padStart(2,"0")}_${k+1}_${slug(TOPICOS[i][0])}`,f,f.name)));
  $("#carregando").style.display="grid";
  $("#btnEnviar").disabled=true;
  const ctl=new AbortController(), limite=setTimeout(()=>ctl.abort(),120000);
  fetch($("#form").action,{method:"POST",body:fd,mode:"no-cors",signal:ctl.signal})
    .then(()=>{clearTimeout(limite);$("#carregando").style.display="none";$("#form").style.display="none";$("#rodape").style.display="none";$("#sucesso").style.display="block";window.scrollTo(0,0)})
    .catch(()=>{clearTimeout(limite);$("#carregando").style.display="none";$("#btnEnviar").disabled=false;TOPICOS.forEach((_,i)=>{$("#c"+i).disabled=false});avisar("Falha no envio. Verifique a internet e tente de novo.")});
};

window.addEventListener("pageshow",()=>{document.querySelectorAll("textarea").forEach(x=>x.disabled=false);$("#carregando").style.display="none";$("#btnEnviar").disabled=false});
// tela de sucesso após o envio
if(new URLSearchParams(location.search).get("enviado")==="1"){
  $("#form").style.display="none";$("#rodape").style.display="none";$("#sucesso").style.display="block";
}
</script>
</body>
</html>
